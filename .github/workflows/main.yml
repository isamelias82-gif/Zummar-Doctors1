name: Build Android Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Prepare Signing Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Decoding provided release signing keystore from secret..."
          echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          if [ -n "$KEY_ALIAS" ]; then
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          else
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
          fi
        elif [ -f "$GITHUB_WORKSPACE/debug.keystore.base64" ]; then
          echo "No KEYSTORE_BASE64 secret provided. Using consistent keystore from debug.keystore.base64 to match local Android Studio signing..."
          base64 -d debug.keystore.base64 > my-upload-key.jks
          echo "STORE_PASSWORD=android" >> $GITHUB_ENV
          echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
        else
          echo "No KEYSTORE_BASE64 secret provided. Creating release upload keystore for CI..."
          keytool -genkey -v -keystore my-upload-key.jks \
            -storepass android \
            -alias upload \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Zummar Doctors Release,O=Zummar,C=IQ"
          echo "STORE_PASSWORD=android" >> $GITHUB_ENV
          echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          echo "KEY_ALIAS=upload" >> $GITHUB_ENV
        fi
        echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Zummar-Doctors-Release-APK
        path: app/build/outputs/apk/release/*.apk
